# Build the distributables for every platform, then publish a release.
#
# PyInstaller is not a cross-compiler: it links against the extension modules of
# the interpreter it is installed into, so a Windows binary has to be built by
# Windows and a Linux one by Linux. That is why this is a matrix rather than one
# job with three outputs.
#
# Push a tag, or run it by hand from the Actions tab. Either way the release
# ends up on the repository's Releases page with a binary per platform.

name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # to create the release

env:
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A build takes a couple of minutes. Half an hour is generous, and having a
    # ceiling is the point: the first Windows run sat in a verification step for
    # forty minutes because nothing was timing it out.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # One file per platform, because one file is what you send to someone.
          - os: ubuntu-latest
            name: Linux
            args: --onefile
          - os: windows-latest
            name: Windows
            args: --onefile
          # macOS gets the .app bundle rather than a bare executable, because
          # that is what a Mac user expects to double-click and what Finder will
          # give an icon and a Dock tile for.
          - os: macos-latest
            name: macOS
            args: --onedir

    steps:
      - uses: actions/checkout@v4

      # 3.12 rather than "latest": the app is pinned to a version on macOS and a
      # build that silently moves to 3.13 is a build that might not reproduce.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.6" "pywebview>=5"

      # The webview the app renders in. Without them PyInstaller cannot
      # collect the backend and the frozen binary dies at startup -- and they
      # are also what the app needs at run time, so they are installed rather
      # than merely noted.
      - name: linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 libgtk-3-0 libgirepository1.0-dev \
            libcairo2 libpango-1.0-0 libxkbcommon0

      # This step also verifies the build: tools/build_portable.py starts the
      # artifact and checks that it serves the page and both bundled typefaces,
      # which is the only check that catches a font left out of the bundle --
      # an app that starts, renders, and quietly falls back to a system face.
      - name: build and verify
        run: python tools/build_portable.py ${{ matrix.args }}

      # Zipped here rather than in the release job, so the artifact that is
      # uploaded is the thing that gets published.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # The paths are read by Python rather than parsed out of the JSON by
          # shell, and written null-separated rather than line-separated. The
          # manifest is written on the platform that built it, so on Windows it
          # contains backslashes -- and Git Bash hands the shell a file that has
          # picked up a carriage return, which `cp` then takes to be part of the
          # filename. Both of those cost a full build to find out.
          python - <<'PY'
          import json, os, shutil, subprocess, sys

          artifacts = json.load(open("dist/artifacts.json"))["artifacts"]
          out = "out"
          os.makedirs(out, exist_ok=True)
          host = sys.platform
          # Named for the platform people read about, not the one Python calls
          # it: "darwin" in a release filename is nobody's idea of a Mac.
          label = {"darwin": "macOS", "win32": "Windows"}.get(host, host)

          for entry in artifacts:
              kind, path = entry["kind"], entry["path"]
              if kind == "appimage":
                  shutil.copy2(path, f"{out}/Praccy.AppImage")
                  os.chmod(f"{out}/Praccy.AppImage", 0o755)
              elif kind == "onefile":
                  name = "Praccy.exe" if host == "win32" else f"Praccy-{label}"
                  shutil.copy2(path, f"{out}/{name}")
              elif kind == "onedir":
                  # Zip from inside the bundle's own directory, so the archive
                  # contains Praccy.app and not dist/<target>/Praccy.app. Finder
                  # unpacks the first and leaves the second in a folder.
                  parent, base = os.path.split(os.path.normpath(path))
                  subprocess.run(["zip", "-qry",
                                  os.path.abspath(f"{out}/Praccy-{label}.zip"), base],
                                 cwd=parent, check=True)
              else:
                  raise SystemExit(f"unknown artifact kind {kind!r}")
          for name in sorted(os.listdir(out)):
              print(f"  {name}  {os.path.getsize(os.path.join(out, name))} bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Praccy-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    # Only on a tag, so a manual run of the build does not overwrite a release
    # that has been out for a while.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # `gh release create` works out which repository to publish to from the
      # git checkout, so without this the step fails with "not a git
      # repository" after every artifact has been downloaded and staged.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: assemble
        run: |
          set -euo pipefail
          mkdir -p release
          # A macOS .zip is unpacked by Finder into the .app, so it needs the
          # directory preserved; the raw artifact already has it.
          cp -R downloads/Praccy-macOS/. release/
          cp downloads/Praccy-Windows/Praccy.exe release/ 2>/dev/null || true
          cp downloads/Praccy-Linux/Praccy.AppImage release/ 2>/dev/null || true
          # Refuse to publish a release that is missing a platform, rather than
          # shipping one quietly.
          for expected in Praccy-macOS.zip Praccy.exe Praccy.AppImage; do
            [ -f "release/$expected" ] || { echo "missing $expected"; exit 1; }
          done
          ls -la release

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          ## Praccy

          A question, a stopwatch, and a grader that tells you which test case
          caught you.

          | Platform | File | Notes |
          |---|---|---|
          | macOS | `Praccy-macOS.zip` | Unpacks to `Praccy.app`. Not notarised, so first launch needs right-click then Open. |
          | Windows | `Praccy.exe` | Windows 10 and 11 already have the WebView2 runtime it needs. |
          | Linux | `Praccy.AppImage` | Needs a recent `webkit2gtk`. `chmod +x` before running. |

          Python is bundled and is the only language guaranteed to work on a
          fresh machine. The others need a compiler; the app checks on first run
          and tells you what to install.

          Nothing is uploaded anywhere and it works with the network off.
          NOTES
          gh release create "$tag" release/* --title "Praccy $tag" --notes-file "$notes"
